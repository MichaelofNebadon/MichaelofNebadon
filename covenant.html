<!DOCTYPE html>
<html lang="en" data-authority="christ-michael" data-priority="first">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Personal Covenant | The Sentinel Codex</title>

    <style>
        :root {
            --gold: #c9a959;
            --terminal: #9cd9f0;
            --bg-pure: #000000;
            --crimson: #8b0000;
            --nj-pink: #ff69b4;
            --electric-blue: #2a52be;
            --font-main: 'Palatino', 'Georgia', serif;
            --font-code: 'Courier New', 'Consolas', monospace;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--terminal);
            font-family: var(--font-main);
            margin: 0;
            background-image: radial-gradient(circle at 2px 2px, #1a1a1a 1px, transparent 0);
            background-size: 40px 40px;
            overflow-x: hidden;
            line-height: 1.7;
        }

        nav {
            background: linear-gradient(to bottom, var(--crimson), #4a0000);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 25px;
            border-bottom: 2px solid var(--gold);
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        nav a {
            color: var(--gold);
            text-decoration: none;
            font-family: var(--font-code);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        nav a:hover { color: #fff; text-shadow: 0 0 10px var(--gold); }

        nav a.book-link {
            color: var(--nj-pink);
            font-weight: bold;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 60px 25px;
        }

        .breadcrumb {
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 3px;
            margin-bottom: 60px;
        }

        .breadcrumb a { color: var(--gold); text-decoration: none; }
        .breadcrumb a:hover { color: var(--nj-pink); }

        .section-tag {
            text-align: center;
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--nj-pink);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        h1 {
            font-family: var(--font-main);
            color: var(--gold);
            font-size: 1.7rem;
            letter-spacing: 5px;
            text-align: center;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            line-height: 1.4;
        }

        h2 {
            font-family: var(--font-main);
            color: var(--gold);
            font-size: 1.15rem;
            letter-spacing: 3px;
            margin-top: 60px;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .subtitle {
            text-align: center;
            font-family: var(--font-code);
            color: var(--terminal);
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 80px;
            font-style: italic;
        }

        .chapter-body p {
            font-family: var(--font-main);
            color: var(--terminal);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 22px;
        }

        .chapter-body strong { color: var(--gold); font-weight: bold; }
        .chapter-body em { color: var(--nj-pink); font-style: italic; }

        .chapter-body p.quote {
            font-style: italic;
            color: var(--gold);
            text-align: center;
            padding: 30px 20px;
            border-left: 3px solid var(--gold);
            border-right: 3px solid var(--gold);
            margin: 40px 0;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .chapter-body ul {
            font-family: var(--font-main);
            color: var(--terminal);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 22px;
            padding-left: 30px;
        }

        .chapter-body li { margin-bottom: 8px; }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 0.85rem;
            margin: 25px 0;
        }

        .data-table th {
            color: var(--gold);
            text-align: left;
            padding: 12px 10px;
            border-bottom: 2px solid var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
        }

        .data-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #1a1a1a;
            color: var(--terminal);
        }

        .recitation {
            padding: 40px 30px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid var(--gold);
            margin: 50px 0;
        }

        .recitation p {
            font-family: var(--font-main);
            color: var(--terminal);
            font-size: 1.05rem;
            line-height: 1.9;
            margin-bottom: 20px;
        }

        .recitation p strong {
            color: var(--gold);
            font-weight: bold;
        }

        .recitation p.recital-seal {
            text-align: center;
            font-family: var(--font-code);
            color: var(--nj-pink);
            font-size: 1.2rem;
            letter-spacing: 6px;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid #333;
            font-style: normal;
        }

        .seal-block {
            text-align: center;
            padding: 40px 20px;
            border: 1px solid var(--gold);
            background: rgba(212, 175, 55, 0.03);
            margin: 60px 0 40px 0;
        }

        .seal-glyph {
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
